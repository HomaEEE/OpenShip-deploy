name: openship

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_BIND_IP:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=64M
      - --max-connections=50
      - --slow-query-log=1
      - --long-query-time=2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-}
      MARIADB_USER: ${MARIADB_USER:-}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:${PHPMYADMIN_VERSION:-latest}
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_BIND_IP:-127.0.0.1}:${PHPMYADMIN_PORT:-20003}:80"
    environment:
      PMA_HOST: ${PHPMYADMIN_HOST:-mariadb}
      PMA_PORT: ${PHPMYADMIN_PORT_DB:-3306}
      UPLOAD_LIMIT: 128M
      MEMORY_LIMIT: 64M
    depends_on:
      - mariadb

volumes:
  mariadb_data:
    name: mariadb_data
  redis_data:
    name: redis_data

networks:
  default:
    name: ${OPENSHIP_NETWORK:-infra-network}
