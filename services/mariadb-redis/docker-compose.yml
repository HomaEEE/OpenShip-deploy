services:
  mariadb:
    image: mariadb:11.4
    container_name: shared-mariadb
    restart: unless-stopped

    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=30
      - --performance-schema=OFF

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro

    networks:
      - shared-backend

    mem_limit: 384m
    cpus: "0.50"

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: shared-redis
    restart: unless-stopped

    command:
      - redis-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - shared-backend

    mem_limit: 80m
    cpus: "0.25"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  mariadb_data:
  redis_data:

networks:
  shared-backend:
    name: shared-backend
    external: true