services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: openship-mariadb
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mariadb
    entrypoint: ["/usr/local/bin/mariadb-entrypoint.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      SERVER_RAM_GB: ${SERVER_RAM_GB:-}
      SERVER_CPU_CORES: ${SERVER_CPU_CORES:-}
      MARIADB_BUFFER_POOL_SIZE: ${MARIADB_BUFFER_POOL_SIZE:-}
      MARIADB_BUFFER_POOL_INSTANCES: ${MARIADB_BUFFER_POOL_INSTANCES:-}
      MARIADB_MAX_CONNECTIONS: ${MARIADB_MAX_CONNECTIONS:-}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/mariadb-entrypoint.sh:/usr/local/bin/mariadb-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping --socket=/run/mysqld/mysqld.sock || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 3s

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: openship-redis
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redis
    entrypoint: ["/usr/local/bin/redis-entrypoint.sh"]
    environment:
      SERVER_RAM_GB: ${SERVER_RAM_GB:-}
      SERVER_CPU_CORES: ${SERVER_CPU_CORES:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 3s

volumes:
  mariadb_data:
    name: openship_mariadb_data
  redis_data:
    name: openship_redis_data

networks:
  default:
    name: openship-network
