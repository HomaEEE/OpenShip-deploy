services:
  web:
    image: ${IMAGE_NAME:-ghcr.io/username/repo}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://example.com}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"

      # Database
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-mariadb}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-openship_root_secret}"

      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Laravel Drivers
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_PREFIX: "${APP_SLUG:-app}_cache_"
      REDIS_PREFIX: "${APP_SLUG:-app}_database_"
      SESSION_COOKIE: "${APP_SLUG:-app}_session"

      # FrankenPHP / Caddy
      SERVER_NAME: ":80"
      FRANKENPHP_CONFIG: "worker ./public/frankenphp-worker.php"
    volumes:
      - app_storage:/app/storage
    networks:
      - openship-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_storage:
    name: ${APP_SLUG:-app}_storage

networks:
  openship-network:
    name: openship-network
    external: true
